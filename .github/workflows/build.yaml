name: Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set artifact name
        run: |
          PROJECT_NAME="$(node --print 'require("./package.json").name')"
          PROJECT_VERSION="${GITHUB_SHA:0:7}"
          echo "project_name=$PROJECT_NAME" >> "$GITHUB_ENV"
          echo "artifact_name=$PROJECT_NAME-$PROJECT_VERSION.vsix" >> "$GITHUB_ENV"

      - name: Build and Package
        run: |
          npm run build
          npx @vscode/vsce package --no-dependencies --out "${{ env.artifact_name }}"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.project_name }}
          path: ${{ env.artifact_name }}

  Lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
